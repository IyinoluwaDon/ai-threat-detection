services:
  nginx:
    image: nginx:stable
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: threats
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
